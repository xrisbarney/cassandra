[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cyber-threat-modelling"
version = "0.1.0"
description = "Reproducible cyber-threat forecasting research pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
science = [
    "numpy>=2,<2.4",
    "numba>=0.63.1,<0.64",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "pyarrow>=18,<30",
    "pymc>=5.20,<6",
    "arviz>=0.21,<1",
    "xarray>=2024.10,<2027",
    "scikit-learn>=1.6,<2",
    "statsmodels>=0.14,<0.16",
]

[project.scripts]
ctm = "cyber_threat_modelling.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cyber_threat_modelling"]

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "docs", "tests", "scripts", "README.md",
           "IMPLEMENTATION_PLAN.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", "docs/checks"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
required-version = "==0.13.4"
