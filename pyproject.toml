[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cassandra-threatcast"
version = "0.1.0"
description = "Bayesian hierarchical state-space modeling of cyber threats and systemic economic risk"
requires-python = ">=3.11"
dependencies = [
    "numpyro>=0.15",
    "jax>=0.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "properscoring>=0.1",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "requests>=2.31",
    "httpx>=0.27",
    "tqdm>=4.66",
    "arviz>=0.18",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "pmdarima>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]
dashboard = [
    "streamlit>=1.36",
]
# Optional funsor-enumeration support; see docs/PAPER_NOTES.md.
enum-sampler = [
    "funsor>=0.4.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
