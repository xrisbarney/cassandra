model:
  K: 8             # number of threat topics
  S: 11            # number of sectors (matching BEA I-O summary level)
  r: 3             # number of latent intensity factors
  r_sigma: 2       # number of latent severity factors
  R: 3             # number of regimes
  vi_rank: 10      # rank for low-rank variational approximation

mcmc:
  num_warmup: 1000
  num_samples: 2000
  num_chains: 1              # one blocked chain; run different seeds independently
  target_accept_prob: 0.9
  max_tree_depth: 10
  gibbs_warmup_blocks: 2       # discarded NUTS/FFBS alternations
  gibbs_blocks: 20             # retained alternations; draws are split among blocks
  block_warmup: 100            # NUTS adaptation after the first block

hawkes:
  enabled: false               # optional paper Step 10 cross-topic excitation

forecast:
  exposure_concentration: 200  # uncertainty around each M_t sector allocation

evaluation:
  test_years: 3
  val_years: 1
  horizons: [1, 3, 6, 12]   # forecast horizons in months
  mcmc:                     # smaller per-origin refits for rolling evaluation
    num_warmup: 300
    num_samples: 200
    gibbs_warmup_blocks: 1
    gibbs_blocks: 5
    block_warmup: 50

paths:
  cache_dir: "data/cache"
  processed_dir: "data/processed"
  results_dir: "results"

apis:
  nvd_base_url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  epss_base_url: "https://api.first.org/data/v1/epss"
  cisa_kev_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  sec_efts_url: "https://efts.sec.gov/LATEST/search-index?q=%22cybersecurity+incident%22+%22Item+1.05%22&dateRange=custom&startdt={start}&enddt={end}&forms=8-K"

bea:
  year: 2022        # BEA I-O table year to use (fetched via API)

effort:
  method: "hp_filter"
  hp_lambda: 1600

damage:
  shape_prior_alpha: 2.0
  shape_prior_beta: 1.0
  scale_prior_alpha: 1.0
  scale_prior_beta: 2.0

# Enhanced mode: Claude-proposed statistical enhancements beyond the paper's
# native specification. Off by default (paper-native). Enable with the
# --enhanced-mode flag on train.py / forecast.py, or set enabled: true here.
# See docs/MODEL_VARIANTS.md for the paper-vs-enhanced comparison.
enhanced:
  enabled: false
  student_t_df: 4.0   # degrees of freedom for heavy-tailed latent innovations

# Learned temporal kernel: a moving-window ("square") covariance component
# with learnable half-width h (months), amplitude sigma_g, and per-topic
# loadings a_g. Quantifies how strongly nearby months co-move beyond the AR
# factor dynamics and global trends (docs/PAPER_NOTES.md §9). Disabled by
# default (paper-native); train a comparison variant with
#   python scripts/ablation.py --variants full,kernel
kernel:
  enabled: false
  halfwidth_prior_months: 24   # prior centre: a ~4-year square window
  max_halfwidth: 60            # window support (months each side)
