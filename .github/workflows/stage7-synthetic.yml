name: Stage 7 synthetic validation

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Run the activated pending grid after numerical verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  NUMBA_OPT: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  PYTHONUTF8: '1'
  UV_PYTHON_DOWNLOADS: never

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.0'
      - name: Install locked environment and pinned compiler
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --extra science --group dev --python 3.12.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/setup_compiler.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify coordinates, fixtures and complete targets
        shell: pwsh
        run: |
          . ./scripts/Use-Compiler.ps1
          .venv/Scripts/python.exe -m pytest tests/test_stage7_joint_coordinates.py tests/test_stage7_block_coordinates.py tests/test_stage7_hosted.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/ci_stage7.py verify --output artifacts/stage7/hosted-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-hosted-verification
          path: artifacts/stage7/hosted-verification
          retention-days: 1
          if-no-files-found: warn

  fit:
    needs: verify
    if: ${{ inputs.execute }}
    runs-on: windows-2022
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {key: primary-fallback_zero-7103, candidate: primary, case: fallback_zero-7103}
          - {key: level_tight-representative-7101, candidate: level_tight, case: representative-7101}
          - {key: level_tight-fallback_zero-7101, candidate: level_tight, case: fallback_zero-7101}
          - {key: level_wide-representative-7101, candidate: level_wide, case: representative-7101}
          - {key: level_wide-fallback_zero-7101, candidate: level_wide, case: fallback_zero-7101}
          - {key: dynamics_tight-representative-7101, candidate: dynamics_tight, case: representative-7101}
          - {key: dynamics_tight-fallback_zero-7101, candidate: dynamics_tight, case: fallback_zero-7101}
          - {key: dynamics_wide-representative-7101, candidate: dynamics_wide, case: representative-7101}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.0'
      - name: Install locked environment and pinned compiler
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --extra science --group dev --python 3.12.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/setup_compiler.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run declared case and independently verify saved diagnostics
        timeout-minutes: 320
        shell: pwsh
        env:
          STAGE7_CASE_KEY: ${{ matrix.key }}
        run: |
          . ./scripts/Use-Compiler.ps1
          .venv/Scripts/python.exe -u scripts/ci_stage7.py fit --case $env:STAGE7_CASE_KEY --output "artifacts/stage7/hosted-audits/$env:STAGE7_CASE_KEY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve complete or partial synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-${{ matrix.key }}
          path: |
            artifacts/stage7/rank-two-joint-v1/${{ matrix.candidate }}/${{ matrix.case }}
            artifacts/stage7/hosted-audits/${{ matrix.key }}
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn
