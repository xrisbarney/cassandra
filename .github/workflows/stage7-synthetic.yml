name: Stage 7 synthetic validation

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Run the activated pending grid after numerical verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  NUMBA_OPT: '3'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  PYTHONUTF8: '1'
  UV_PYTHON_DOWNLOADS: never

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        opt: ['3']
    env:
      NUMBA_OPT: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.0'
      - name: Install locked environment and pinned compiler
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --extra science --group dev --python 3.12.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/setup_compiler.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify coordinates, fixtures and complete targets
        shell: pwsh
        run: |
          . ./scripts/Use-Compiler.ps1
          .venv/Scripts/python.exe -m pytest tests/test_stage7_joint_coordinates.py tests/test_stage7_block_coordinates.py tests/test_stage7_hosted.py tests/test_stage7_checkpoint.py tests/test_synthetic_runner.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/ci_stage7.py verify --output artifacts/stage7/hosted-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7-hosted-verification-opt${{ matrix.opt }}
          path: artifacts/stage7/hosted-verification
          retention-days: 1
          if-no-files-found: warn

  attempt0:
    needs: verify
    if: ${{ inputs.execute }}
    uses: ./.github/workflows/stage7-attempt.yml
    with:
      attempt: 0
      previous: -1

  attempt1:
    needs: attempt0
    if: ${{ inputs.execute }}
    uses: ./.github/workflows/stage7-attempt.yml
    with:
      attempt: 1
      previous: 0

  attempt2:
    needs: attempt1
    if: ${{ inputs.execute }}
    uses: ./.github/workflows/stage7-attempt.yml
    with:
      attempt: 2
      previous: 1
