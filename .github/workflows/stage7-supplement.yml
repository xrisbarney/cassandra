name: Stage 7 bounded convergence supplement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-bounded-supplement
  cancel-in-progress: false

env:
  NUMBA_OPT: '3'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  PYTHONUTF8: '1'
  UV_PYTHON_DOWNLOADS: never

jobs:
  fit:
    runs-on: windows-2022
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [masked_fallback, reduced_representative, reduced_fallback, matched_one_factor_fallback]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.0'
      - name: Install locked environment and pinned compiler
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --extra science --group dev --python 3.12.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/setup_compiler.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify supplement guards
        shell: pwsh
        run: |
          . ./scripts/Use-Compiler.ps1
          .venv/Scripts/python.exe -m pytest tests/test_stage7_supplement.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify complete target and run the single declared attempt
        timeout-minutes: 320
        shell: pwsh
        env:
          SUPPLEMENT_CASE: ${{ matrix.case }}
        run: |
          . ./scripts/Use-Compiler.ps1
          .venv/Scripts/python.exe -u scripts/run_stage7_supplement.py fit --case $env:SUPPLEMENT_CASE --output "artifacts/stage7/supplement-v1/$env:SUPPLEMENT_CASE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage7-supplement-${{ matrix.case }}
          path: artifacts/stage7/supplement-v1/${{ matrix.case }}
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn
